[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "piharness"
version = "2.1.3"
description = "Import programs from GitHub and keep them running on a Raspberry Pi"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "argon2-cffi>=23.1.0",
]

[project.urls]
Homepage = "https://github.com/MeridianAlgo/PiHarness"

[tool.setuptools]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
